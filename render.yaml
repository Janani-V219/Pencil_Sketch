services:
  - type: web
    name: pencilsketch-ai
    env: python
    buildCommand: pip install -r requirements.txt && python generate_presets.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
